# Despliegue reutilizable: imágenes web y worker a GHCR, migraciones a Supabase y update.sh en
# el VPS por SSH (patrón del secop-tracker). Se llama desde el repo tras CI en verde en main.
name: deploy-ssh

on:
  workflow_call:
    inputs:
      image-name:
        type: string
        required: true          # p. ej. transformit/plagas-erp
      app-dir:
        type: string
        default: /opt/app
      environment:
        type: string
        default: produccion
    secrets:
      SUPABASE_ACCESS_TOKEN: { required: true }
      SUPABASE_DB_PASSWORD: { required: true }
      SUPABASE_PROJECT_REF: { required: true }
      VPS_HOST: { required: true }
      VPS_USER: { required: true }
      VPS_SSH_KEY: { required: true }
      VPS_KNOWN_HOSTS: { required: true }

permissions:
  contents: read
  packages: write

concurrency:
  group: deploy-${{ inputs.environment }}
  cancel-in-progress: false

jobs:
  imagenes:
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.meta.outputs.tag }}
    steps:
      - uses: actions/checkout@v5
      - id: meta
        run: echo "tag=${GITHUB_SHA::12}" >> "$GITHUB_OUTPUT"
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: deploy/Dockerfile
          target: web
          push: true
          tags: ghcr.io/${{ inputs.image-name }}:web-${{ steps.meta.outputs.tag }},ghcr.io/${{ inputs.image-name }}:web-latest
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: deploy/Dockerfile
          target: worker
          push: true
          tags: ghcr.io/${{ inputs.image-name }}:worker-${{ steps.meta.outputs.tag }},ghcr.io/${{ inputs.image-name }}:worker-latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

  migraciones:
    runs-on: ubuntu-latest
    needs: [imagenes]
    environment: ${{ inputs.environment }}
    steps:
      - uses: actions/checkout@v5
      - uses: supabase/setup-cli@v1
        with: { version: latest }
      - run: supabase link --project-ref "$SUPABASE_PROJECT_REF"
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_PROJECT_REF: ${{ secrets.SUPABASE_PROJECT_REF }}
          SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
      - run: supabase db push
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}

  vps:
    runs-on: ubuntu-latest
    needs: [imagenes, migraciones]
    environment: ${{ inputs.environment }}
    steps:
      - name: Llave SSH
        run: |
          test -n "${{ secrets.VPS_SSH_KEY }}" && test -n "${{ secrets.VPS_KNOWN_HOSTS }}"
          mkdir -p ~/.ssh
          printf '%s\n' "${{ secrets.VPS_SSH_KEY }}" > ~/.ssh/id_ed25519 && chmod 600 ~/.ssh/id_ed25519
          printf '%s\n' "${{ secrets.VPS_KNOWN_HOSTS }}" > ~/.ssh/known_hosts && chmod 644 ~/.ssh/known_hosts
      - name: update.sh en el VPS
        run: ssh -o BatchMode=yes -o ConnectTimeout=20 "${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }}" "TAG=${{ needs.imagenes.outputs.tag }} ${{ inputs.app-dir }}/deploy/update.sh"
